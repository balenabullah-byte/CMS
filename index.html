<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#f8fafc">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
      try {
        const preference = localStorage.getItem('campus-theme')
        document.documentElement.dataset.theme = ['dark', 'light'].includes(preference) ? preference : 'system'
      } catch { document.documentElement.dataset.theme = 'system' }
    </script>
    <title>Campus Resource Hub</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
