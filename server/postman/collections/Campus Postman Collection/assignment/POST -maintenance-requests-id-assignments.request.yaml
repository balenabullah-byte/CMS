$kind: http-request
name: 'POST /maintenance-requests/:id/assignments'
description: 'Access: coordinator. Success: 201, JSON with a data field. Errors use {"error":"message"}. Invalid input 400, missing session 401, insufficient role 403, missing or inaccessible record 404, conflict 409, rate limit 429 where applicable.'
method: POST
url: '{{baseUrl}}/maintenance-requests/{{requestId}}/assignments'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "technician_id": "{{technicianId}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 201 Created', () => pm.response.to.have.status(201));
      pm.test('Response time < 2000ms', () => pm.expect(pm.response.responseTime).to.be.below(2000));
      pm.test('Content-Type is JSON', () => pm.response.to.have.header('Content-Type', /application\/json/));
      pm.test('Response has data field', () => pm.expect(pm.response.json()).to.have.property('data'));
      pm.test('Assignment has id, technician_id, status', () => {
        const data = pm.response.json().data;
        pm.expect(data).to.be.an('object');
        pm.expect(data).to.have.property('id');
        pm.expect(data).to.have.property('technician_id');
        pm.expect(data).to.have.property('status');
      });
      pm.test('Save assignmentId to collection variable', () => {
        const data = pm.response.json().data;
        if (data && data.id) pm.collectionVariables.set('assignmentId', String(data.id));
      });
