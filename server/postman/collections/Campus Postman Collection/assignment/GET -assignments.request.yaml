$kind: http-request
name: 'GET /assignments'
description: 'Access: technician coordinator. Success: 200, JSON with a data field. Errors use {"error":"message"}. Invalid input 400, missing session 401, insufficient role 403, missing or inaccessible record 404, conflict 409, rate limit 429 where applicable.'
method: GET
url: '{{baseUrl}}/assignments'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 200 OK', () => pm.response.to.have.status(200));
      pm.test('Response time < 2000ms', () => pm.expect(pm.response.responseTime).to.be.below(2000));
      pm.test('Content-Type is JSON', () => pm.response.to.have.header('Content-Type', /application\/json/));
      pm.test('Response has data field', () => pm.expect(pm.response.json()).to.have.property('data'));
      pm.test('Data is an array', () => pm.expect(pm.response.json().data).to.be.an('array'));
      pm.test('Each assignment has id, technician_id, status', () => {
        const data = pm.response.json().data;
        if (data.length > 0) {
          pm.expect(data[0]).to.have.property('id');
          pm.expect(data[0]).to.have.property('technician_id');
          pm.expect(data[0]).to.have.property('status');
        }
      });
