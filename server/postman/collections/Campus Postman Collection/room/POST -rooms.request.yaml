$kind: http-request
name: 'POST /rooms'
description: 'Access: admin. Success: 201, JSON with a data field. Errors use {"error":"message"}. Invalid input 400, missing session 401, insufficient role 403, missing or inaccessible record 404, conflict 409, rate limit 429 where applicable.'
method: POST
url: '{{baseUrl}}/rooms'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "building_id": "{{buildingId}}",
      "room_code": "101"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 201 Created', () => pm.response.to.have.status(201));
      pm.test('Response time < 2000ms', () => pm.expect(pm.response.responseTime).to.be.below(2000));
      pm.test('Content-Type is JSON', () => pm.response.to.have.header('Content-Type', /application\/json/));
      pm.test('Response has data field', () => pm.expect(pm.response.json()).to.have.property('data'));
      pm.test('Created room has id, room_code, building_id', () => {
        const data = pm.response.json().data;
        pm.expect(data).to.be.an('object');
        pm.expect(data).to.have.property('id');
        pm.expect(data).to.have.property('room_code');
      });
      pm.test('Save roomId to collection variable', () => {
        const data = pm.response.json().data;
        if (data && data.id) pm.collectionVariables.set('roomId', String(data.id));
      });
