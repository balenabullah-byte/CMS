$kind: http-request
name: PATCH /assignments/:id/progress
description: 'Access: technician. Success: 200, JSON with a data field. Errors use {"error":"message"}. Invalid input 400, missing session 401, insufficient role 403, missing or inaccessible record 404, conflict 409, rate limit 429 where applicable.'
url: "{{baseUrl}}/assignments/{{assignmentId}}/progress"
method: PATCH
body:
  type: json
  content: |-
    {
      "body": "Inspecting fixture"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Expected HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON result', () => pm.expect(pm.response.json()).to.have.property('data'));
    language: text/javascript
order: 5000
